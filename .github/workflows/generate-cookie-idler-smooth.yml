name: Generate Cookie Idler Smooth Counter

on:
  push:
    paths:
      - tools/generate-cookie-idler-smooth.py
      - .github/workflows/generate-cookie-idler-smooth.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate script
        run: python tools/generate-cookie-idler-smooth.py
      - name: Commit generated script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CookieIdler-Redux.smooth-counter.js
          git diff --cached --quiet && exit 0
          git commit -m "Generate Cookie Idler smooth-counter raw script"
          git push
